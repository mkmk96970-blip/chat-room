name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build Android App Bundle
        run: npx expo export --platform android
      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: dist/
